experiment:
  backend: pytorch
  data_config:
    dataset_path: /opt/datasets/Music4All/music4all/onion_elliot/{0}/interactions.tsv
    root_folder: /opt/datasets/Music4All/music4all/onion_elliot/{0}/splits
    strategy: hierarchy
  dataset: onion
  evaluation:
    cutoffs:
    - 5
    paired_ttest: false
    simple_metrics:
    - nDCG
    wilcoxon_test: false
  external_models_path: ../external/models/__init__.py
  gpu: 0
  models:
    external.DeepMF:
      epochs: 500
      lr: 0.000001 # [ 0.01, 0.001, 0.0001, 0.00001 ]
      batch_size: 4096
      reg: 0.1 # [ 0.1, 0.01, 0.001, 0.0001 ]
      embedding_dim: [256] # 512, 256, 128, 64 ] #
      user_mlp: [256] # [1024, 256], [512, 256], [1024], [512], [256] ]
      item_mlp: [256] # [1024, 256], [512, 256], [1024], [512], [256] ]
      neg_ratio:  20  # 1 , 10, 20, 100 ]
      similarity: cosine
      mu: [0.0001]
      early_stopping:
        monitor: nDCG@5
        patience: 5
        verbose: false
      meta:
        save_recs: true
        save_weights: true
      seed: 123
  path_output_rec_performance: /opt/scratch/marta/results/{0}/full/performance
  path_output_rec_result: /opt/scratch/marta/results/{0}/full/recs
  path_output_rec_weight: /opt/scratch/marta/results/{0}/full/weights
  prefiltering:
    core: 5
    strategy: iterative_k_core
  splitting:
    test_splitting:
      folds: 10
      strategy: random_cross_validation
    validation_splitting:
      strategy: random_subsampling
      test_ratio: 0.2
  top_k: 100
