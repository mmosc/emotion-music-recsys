experiment:
  backend: pytorch
  data_config:
    dataset_path: /opt/datasets/Music4All/music4all/onion_elliot/{0}/interactions.tsv
    side_information:
    - dataloader: EmotionAttribute
      emotion_features: /opt/datasets/Music4All/music4all/onion_elliot/{0}/emotion_embeddings/gems
    strategy: dataset
  dataset: onion186
  evaluation:
    cutoffs:
    - 1
    - 5
    - 10
    - 20
    paired_ttest: false
    simple_metrics:
    - Recall
    - Precision
    - nDCG
    - MRR
    - HR
    - EFD
    - EPC
    - ARP
    - PopREO
    - PopRSP
    - ItemCoverage
    - UserCoverage
    wilcoxon_test: false
  external_models_path: ../external/models/__init__.py
  gpu: 0
  models:
    external.SiBraR:
      agg_method:
      - mean
      b_norm:
      - false
      batch_size:
      - 31
      cl_always_interactions_vs_agg:
      - false
      cl_force_interactions_modality:
      - true
      cl_temp:
      - 0.0001
      cl_weight:
      - 0.001
      dropout:
      - 0.001
      early_stopping:
        monitor: nDCG@5
        patience: 10
        verbose: false
      emb_dim:
      - 256
      epochs: 500
      factors: 64
      factors_multimod: 64
      input_dim:
      - 128
      loaders: ('EmotionAttribute', )
      log_wandb: false
      lr:
      - 1.0e-05
      meta:
        save_recs: true
        save_weights: true
      mid_layers:
      - - 512
      modalities: ('emotion', )
      norm_input_feat:
      - false
      norm_sbra_input:
      - false
      num_neg:
      - 5
      seed: 123
      u_prof:
      - true
      w_decay:
      - 0.01
  path_output_rec_performance: /opt/scratch/marta/results/{0}/full_e/performance
  path_output_rec_result: /opt/scratch/marta/results/{0}/full_e/recs
  path_output_rec_weight: /opt/scratch/marta/results/{0}/full_e/weights
  prefiltering:
    core: 5
    strategy: iterative_k_core
  splitting:
    test_splitting:
      folds: 10
      strategy: random_cross_validation
    validation_splitting:
      strategy: random_subsampling
      test_ratio: 0.2
  top_k: 100
loaders: ('EmotionAttribute', )
modalities: ('emotion', )
