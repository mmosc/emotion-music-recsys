experiment:
  backend: pytorch
  data_config:
    dataset_path: /opt/datasets/Music4All/music4all/onion_elliot/{0}/interactions.tsv
    root_folder: /opt/datasets/Music4All/music4all/onion_elliot/{0}/splits
    side_information:
    - audio_features: /opt/datasets/Music4All/music4all/onion_elliot/{0}/audio_embeddings/maest_pca9
      dataloader: AudioAttribute
    - dataloader: TextualAttribute
      textual_features: /opt/datasets/Music4All/music4all/onion_elliot/{0}/textual_embeddings/bert_pca9
    - dataloader: VisualAttribute
      visual_features: /opt/datasets/Music4All/music4all/onion_elliot/{0}/visual_embeddings/resnet_pca9
    - dataloader: EmotionAttribute
      emotion_features: /opt/datasets/Music4All/music4all/onion_elliot/{0}/emotion_embeddings/gems
    strategy: hierarchy
  dataset: onion186
  evaluation:
    cutoffs:
    - 5
    paired_ttest: false
    simple_metrics:
    - nDCG
    wilcoxon_test: false
  external_models_path: ../external/models/__init__.py
  gpu: 0
  models:
    external.LightGCNM:
      aggregation:
      - mean
      batch_size: 128
      early_stopping:
        monitor: nDCG@5
        patience: 5
        verbose: false
      epochs: 500
      factors:
      - 9
      factors_multimod: 64
      l_w:
      - 1.0e-05
      loaders: ('AudioAttribute', 'TextualAttribute', 'VisualAttribute', 'EmotionAttribute')
      log_wandb: false
      lr:
      - 0.001
      meta:
        save_recs: true
        save_weights: true
      modalities: ('audio', 'textual', 'visual', 'emotion')
      n_layers:
      - 1
      normalize:
      - false
      seed: 123
  path_output_rec_performance: /opt/scratch/marta/results/{0}/pca9_atve/performance
  path_output_rec_result: /opt/scratch/marta/results/{0}/pca9_atve/recs
  path_output_rec_weight: /opt/scratch/marta/results/{0}/pca9_atve/weights
  prefiltering:
    core: 5
    strategy: iterative_k_core
  splitting:
    test_splitting:
      folds: 10
      strategy: random_cross_validation
    validation_splitting:
      strategy: random_subsampling
      test_ratio: 0.2
  top_k: 100
loaders: ('AudioAttribute', 'TextualAttribute', 'VisualAttribute', 'EmotionAttribute')
modalities: ('audio', 'textual', 'visual', 'emotion')
