experiment:
  dataset: onion
  data_config:
    strategy: hierarchy
    root_folder: /opt/datasets/Music4All/music4all/onion_elliot/{0}/splits
    side_information:
      - dataloader: EmotionAttribute
        emotion_features: /opt/datasets/Music4All/music4all/onion_elliot/{0}/emotion_embeddings/gems
  backend: pytorch
  evaluation:
    cutoffs: [ 5 ]
    simple_metrics: [ nDCG ]
  models:
    external.RerankingRecommender:
      input_path: ""
      similarity: [ cosine, euclidean ]
      k: [ 100 ]
