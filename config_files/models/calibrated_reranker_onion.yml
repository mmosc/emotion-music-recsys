experiment:
  dataset: onion
  data_config:
    strategy: hierarchy
    root_folder: /opt/datasets/Music4All/music4all/onion_elliot/{0}/splits
    side_information:
      - dataloader: EmotionAttribute
        emotion_features: /opt/datasets/Music4All/music4all/onion_elliot/{0}/emotion_embeddings/gems
  backend: pytorch
  evaluation:
    cutoffs: [ 5 ]
    simple_metrics: [ nDCG ]
  models:
    external.CalibratedReranker:
      input_path: /opt/scratch/marta/results/onion/full/recs/LightGCN_seed=123_e=500_bs=128_lr=0$005_factors=64_l_w=1e-05_n_layers=2_normalize=True_fold=0.tsv
      lambda: [ 0.1, 0.3, 0.5, 0.7, 0.9 ]
      k: [ 100 ]
