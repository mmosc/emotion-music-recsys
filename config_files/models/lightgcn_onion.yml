experiment:
  dataset: onion
  data_config:
    strategy: hierarchy
    root_folder: /opt/datasets/Music4All/music4all/onion_elliot/{0}/splits
  backend: pytorch
  evaluation:
    cutoffs: [ 5 ]
    simple_metrics: [ nDCG ]
  models:
    external.LightGCN:
      meta:
        save_weights: False
        save_recs: False
      lr: [ 1.e-3, 1.e-4, 1.e-5, 1.e-6 ]
      n_layers: [ 1, 2, 3 ]
      batch_size: 256
      normalize: [ False, True ]
      factors: [ 64, 128, 256 ]
      l_w: [ 1.e-3, 1.e-4, 1.e-5 ]
