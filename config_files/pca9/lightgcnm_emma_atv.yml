
modalities: ('audio', 'textual', 'visual')
loaders: ('AudioAttribute', 'TextualAttribute', 'VisualAttribute')
experiment:
  dataset: emma
  path_output_rec_result: /opt/scratch/marta/results/{0}/pca9_atv/recs
  path_output_rec_weight: /opt/scratch/marta/results/{0}/pca9_atv/weights
  path_output_rec_performance: /opt/scratch/marta/results/{0}/pca9_atv/performance
  data_config:
    strategy: hierarchy
    root_folder: /opt/datasets/Music4All/music4all/onion_elliot/{0}/splits
    side_information:
      - dataloader: AudioAttribute
        audio_features: /opt/datasets/Music4All/music4all/onion_elliot/{0}/audio_embeddings/maest_pca9
      - dataloader: TextualAttribute
        textual_features: /opt/datasets/Music4All/music4all/onion_elliot/{0}/textual_embeddings/bert_pca9
      - dataloader: VisualAttribute
        visual_features: /opt/datasets/Music4All/music4all/onion_elliot/{0}/visual_embeddings/resnet_pca9

  backend: pytorch
  evaluation:
    cutoffs: [ 5 ]
    simple_metrics: [ nDCG ]
  models:
    external.LightGCNM:
      meta:
        save_weights: False
        save_recs: False
      lr: [ 1.e-3, 1.e-4, 1.e-5, 1.e-6 ]
      factors: [ 2048, 1024, 512, 256, 128, 64, 9 ]
      n_layers: [ 1, 2, 3 ]
      batch_size: 128
      normalize: [False, True]
      aggregation: [ 'concat', 'sum', 'mean' ]
      l_w: [ 1.e-3, 1.e-4, 1.e-5 ]
